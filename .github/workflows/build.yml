name: Build Aegis APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project Files
        run: |
          mkdir -p workspace
          unzip -q -o AegisAI_Fixed.zip -d workspace
          PROJ_DIR=$(find workspace -name "settings.gradle*" -exec dirname {} \; | head -n 1)
          echo "PROJECT_DIR=$PROJ_DIR" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x ./gradlew || true
          gradle assembleDebug --no-daemon -x test

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AegisAI-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
          
