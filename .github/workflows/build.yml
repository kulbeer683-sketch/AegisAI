name: Build Aegis APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project Files
        run: |
          mkdir -p workspace
          unzip -q -o AegisAI_v1.0_Production_Master.zip -d workspace
          PROJ_DIR=$(find workspace -name "settings.gradle*" -exec dirname {} \; | head -n 1)
          echo "PROJECT_DIR=$PROJ_DIR" >> $GITHUB_ENV

      - name: Inspect VoicePersonaEngine Context
        run: |
          TARGET_FILE=$(find workspace -name "VoicePersonaEngine.kt" | head -n 1)
          if [ -n "$TARGET_FILE" ]; then
            echo "=== Exact Lines 35 to 55 of VoicePersonaEngine.kt ==="
            sed -n '35,55p' "$TARGET_FILE"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      - name: Scan All Project Errors
        run: |
          cd "$PROJECT_DIR"
          # --continue पूरे प्रोजेक्ट की सारी त्रुटियों को एक साथ चेक करेगा
          gradle assembleDebug --continue --no-daemon -x test

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AegisAI-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
