name: Build Aegis APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project Files
        run: |
          unzip -o AegisAI_v1.0_Production_Master.zip -d aegis_project
          cp -r aegis_project/aegis/AegisAI/* . || cp -r aegis_project/* .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Executable Permissions
        run: |
          chmod +x gradlew || true

      - name: Build Debug APK
        run: |
          gradle wrapper
          ./gradlew assembleDebug --no-daemon -x test

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AegisAI-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          
